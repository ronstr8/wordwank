# Global settings shared across all microservices
global:
  domain: logodal.com
  # Brands ("skins") served by this one deployment, sharing one database and
  # one player pool. Each site gets its own ingress host + TLS secret; the
  # frontend and backend pick the brand from the request's Host header.
  brands:
    default: logodal
    sites:
      - host: logodal.com
        brand: logodal
        tlsSecret: logodal-tls
      - host: wordwank.com
        brand: wordwank
        tlsSecret: wordwank-tls
  # The single port for all traffic (Frontend, API, WS)
  externalPort: 80
  registry: localhost:5000
  namespace: logodal
  projectName: "logodal"
  imageTag: 3.1.0
  imagePullPolicy: Always
  maxPlayers: 13
  randomLetterScoreMode: "true"
  gameDuration: 30
  quickBonusSeconds: 10
  # Skip the Discord/SMS "started playing" alert if a human joined within this many seconds.
  adminNotifyQuietSeconds: 300
  rackSize: 7
  # Length bonus: lengthBonusBase points at lengthBonusStart letters, doubling per letter after.
  lengthBonusStart: 5
  lengthBonusBase: 10
  minVowels: 2
  minConsonants: 2
  logLevel: debug
  defaultLanguage: en
  chatHistorySize: 50
  totalTiles: 100
  kofiId: "logodal"
  kofiEnabled: false
  paypalEnabled: false
  paypalEmail: "quinnfazigu@gmail.com"
  projectCodeLink: "https://github.com/ronstr8/logodal"
  scoreAgainstAI: "true"
  endOnAllPlayed: "true"
  storageClass: "logodal-db-local"
  persistence:
    manualPV: true


# Centralized Ingress configuration
ingress:
  enabled: true
  host: logodal.com
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  tls:
    enabled: true
    secretName: logodal-tls

# Subchart overrides
frontend:
  enabled: true
  service:
    type: ClusterIP
    port: 80

wordd:
  enabled: true
  service:
    type: ClusterIP
    port: 2345
  langs: "en,es,fr,de,ru,el"

backend:
  enabled: true
  service:
    port: 3000
  ollama:
    url: "http://ollama.ollama:11434"
    model: "gemma3:12b"
    chat_context_depth: 5
    num_ctx: 4096           # our prompts peak ~400 tokens; the shared pod defaults to 65536
    idle_chatter: false   # canned/filler AI chatter; off = LLM-only, AIs stay silent when the LLM is unavailable
  ai:
    social_enabled: true        # background greetings / compliments / winner congrats
    social_min_gap: 6           # min seconds between AI social lines in a game
    social_max_per_game: 5      # cap on AI social lines per game
    compliment_min_score: 20    # only compliment human plays scoring at least this
    compliment_chance: 0.5      # probability of complimenting a qualifying play
  database:
    url: "dbi:Pg:dbname=logodal;host=postgresql"
    user: "logodal_backend"
  env:
    ADMIN_SMS_EMAIL: "17169032417@tmomail.net"
    CHAT_HISTORY_SIZE: 50

# PostgreSQL dependency configuration
# Game-stats dashboards for Grafana (kube-prometheus-stack in k8s-homelab):
# a read-only Postgres role, a datasource for it, and dashboards/*.json.
grafana:
  enabled: true
  folder: Wordwank
  datasourceName: Wordwank (Postgres)

postgresql:
  enabled: true
  fullnameOverride: postgresql
  image:
    registry: "docker.io"
    repository: "bitnamilegacy/postgresql"
    tag: "16.4.0-debian-12-r0"
  auth:
    database: "logodal"
    username: "logodal_backend"
  primary:
    initdb:
      scriptsConfigMap: db-init
    persistence:
      enabled: true
      size: 10Gi
      storageClass: logodal-db-local
  volumePermissions:
    enabled: true
    image:
      repository: busybox
      tag: 1.36.1
  # Prometheus exporter sidecar + ServiceMonitor (scraped by k8s-homelab's
  # monitoring stack). Versioned Bitnami images now live under bitnamilegacy.
  metrics:
    enabled: true
    image:
      repository: bitnamilegacy/postgres-exporter
      tag: 0.15.0-debian-12-r39
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}
    serviceMonitor:
      enabled: true

redis:
  enabled: true
  fullnameOverride: redis
  architecture: standalone
  auth:
    enabled: false
  master:
    persistence:
      enabled: false
  # Prometheus exporter sidecar + ServiceMonitor, as for postgresql above.
  metrics:
    enabled: true
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}
    serviceMonitor:
      enabled: true
  replica:
    replicaCount: 0

